[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-soc-toolkit"
version = "0.1.0"
description = "Autonomous Multi-Agent Security Operations Framework for Threat Monitoring, Containment Execution, and Automated Reporting"
readme = "README.md"
authors = [
    { name = "Cybersecurity AI Team", email = "research@agenticsoc.org" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "click>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
agentic-soc = "agentic_soc.cli:main"
